# Packages installed only when missing, to set up a new machine. Updates are
# left to each OS or tool (winget upgrade, mise self-update, ...).
# Installed in list order.
packages:
  # Windows: .chezmoiscripts/windows/run_before_20-install-packages.ps1.tmpl
  #   id:      winget package id (installed from the winget source, latest version)
  #   command: executable used to detect an existing install
  #   path:    file glob used instead of command (%LOCALAPPDATA% is expanded)
  winget:
    # PowerShell 7 first: the rest of the setup targets it
    - id: Microsoft.PowerShell
      command: pwsh
    - id: jdx.mise
      command: mise
    - id: Fastfetch-cli.Fastfetch
      command: fastfetch
    - id: Starship.Starship
      command: starship
    - id: sharkdp.bat
      command: bat
    # An older edit.exe ships in System32, so the winget one is found by path
    - id: Microsoft.Edit
      path: "%LOCALAPPDATA%/Microsoft/WinGet/Packages/Microsoft.Edit_*/edit-*/edit.exe"

  # Linux (WSL): latest GitHub release, extracted into ~/.local/bin (no sudo).
  #   command: executable to detect, and to take from the archive
  #   repo:    GitHub repository
  #   asset:   release asset name (glob) per architecture
  #   update:  for tools with no way to update themselves: chezmoi keeps them
  #            at the latest release (.chezmoiexternal.toml.tmpl, checked weekly).
  #            path is the binary inside the archive, after stripComponents.
  #            Without it, the package is installed once
  #            (.chezmoiscripts/linux/run_before_20-install-packages.sh.tmpl).
  github:
    # Updated with `mise self-update`
    - command: mise
      repo: jdx/mise
      asset: { amd64: "mise-v*-linux-x64-musl.tar.gz", arm64: "mise-v*-linux-arm64-musl.tar.gz" }
    - command: fastfetch
      repo: fastfetch-cli/fastfetch
      asset: { amd64: "fastfetch-linux-amd64.tar.gz", arm64: "fastfetch-linux-aarch64.tar.gz" }
      update: { stripComponents: 1, path: usr/bin/fastfetch }
    - command: starship
      repo: starship/starship
      asset: { amd64: "starship-x86_64-unknown-linux-musl.tar.gz", arm64: "starship-aarch64-unknown-linux-musl.tar.gz" }
      update: { stripComponents: 0, path: starship }
    - command: bat
      repo: sharkdp/bat
      asset: { amd64: "bat-*-x86_64-unknown-linux-musl.tar.gz", arm64: "bat-*-aarch64-unknown-linux-musl.tar.gz" }
      update: { stripComponents: 1, path: bat }
